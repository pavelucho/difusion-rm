<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="titulo desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="titulo">Pantalla de trabajo del Procesador de difusión</title>
  <desc id="desc">Esquema de la interfaz: barra lateral a la izquierda con la apertura del estudio, los avisos, los parámetros, las pestañas de medida y la exportación; cuatro paneles de imagen a la derecha; y barra inferior con el corte, la b objetivo, la versión, el manual y la cita. Nueve números señalan cada zona.</desc>

  <defs>
    <!-- Cada panel dibuja la misma anatomía esquemática con los tonos de su mapa:
         lesión restringida (con ROI), foco brillante en T2 sin restricción y líquido. -->
    <clipPath id="recorte-panel"><rect width="367" height="277"/></clipPath>
    <g id="numero">
      <circle r="11" fill="#38bdf8" stroke="#0b1220" stroke-width="2"/>
    </g>
    <!-- Iconos BookOpen y Quote de lucide, los mismos que usa la aplicación. -->
    <symbol id="icono-libro" viewBox="0 0 24 24" fill="none" stroke="#F27D26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 7v14"/>
      <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>
    </symbol>
    <symbol id="icono-cita" viewBox="0 0 24 24" fill="none" stroke="#F27D26" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/>
      <path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/>
    </symbol>
  </defs>

